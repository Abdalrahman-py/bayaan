name: bayaan
description: "Bayaan — AI Quran recitation coach."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  http: ^1.2.0
  record: ^6.2.1
  shared_preferences: ^2.5.5
  go_router: ^17.5.0
  characters: ^1.3.0
  audioplayers: ^6.1.0
  zxcvbnm: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/quran/uthmani.json
    - assets/quran/chapters.json
    - assets/quran/pages.json
    - assets/icons/google_logo.png
    - assets/logo/bayaan_logo.png
    - assets/content/curriculum.json
    - assets/content/lessons/
    - assets/content/quiz/questions.json
    - assets/content/audio/letters/
  fonts:
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/amiri_quran.ttf
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/plus_jakarta_sans_500.ttf
          weight: 500
        - asset: assets/fonts/plus_jakarta_sans_600.ttf
          weight: 600
        - asset: assets/fonts/plus_jakarta_sans_700.ttf
          weight: 700
        - asset: assets/fonts/plus_jakarta_sans_800.ttf
          weight: 800

# Regenerate launcher icons: dart run flutter_launcher_icons
# adaptive_icon_foreground_inset: 0 — the IconKitchen export is already sized
# for the 108dp safe zone, so the generator's default 16% inset would shrink it.
flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21

# Regenerate the native launch screen: dart run flutter_native_splash:create
# Colour is the top-left stop of AppColors.splashGradient, so the OS splash
# hands off to the Flutter splash without a flash. Same colour in dark mode —
# the app itself is light-only for now.
flutter_native_splash:
  color: "#0F766E"
  color_dark: "#0F766E"
  image: "assets/logo/bayaan_logo.png"
  # Android 12+ masks the splash icon to a circle, so it gets its own copy of
  # the mark: 1152px canvas, mark scaled to sit inside the 768px safe circle.
  # Feeding it the untrimmed logo clips the book's outer edges.
  android_12:
    color: "#0F766E"
    color_dark: "#0F766E"
    image: "assets/logo/bayaan_logo_android12.png"
