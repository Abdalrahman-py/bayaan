name: bayaan
description: "Bayaan — AI Quran recitation coach."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  http: ^1.2.0
  record: ^6.2.1
  shared_preferences: ^2.5.5
  go_router: ^17.5.0
  characters: ^1.3.0
  audioplayers: ^6.1.0
  zxcvbnm: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/quran/uthmani.json
    - assets/quran/chapters.json
    - assets/quran/pages.json
    - assets/icons/google_logo.png
    - assets/content/curriculum.json
    - assets/content/lessons/
    - assets/content/quiz/questions.json
    - assets/content/audio/letters/
  fonts:
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/amiri_quran.ttf
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/plus_jakarta_sans_500.ttf
          weight: 500
        - asset: assets/fonts/plus_jakarta_sans_600.ttf
          weight: 600
        - asset: assets/fonts/plus_jakarta_sans_700.ttf
          weight: 700
        - asset: assets/fonts/plus_jakarta_sans_800.ttf
          weight: 800

# Regenerate launcher icons: dart run flutter_launcher_icons
# adaptive_icon_foreground_inset: 0 — the IconKitchen export is already sized
# for the 108dp safe zone, so the generator's default 16% inset would shrink it.
flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21
